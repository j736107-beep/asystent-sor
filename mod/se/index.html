<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stan padaczkowy SOR</title><link rel="stylesheet" href="style.css"></head>
<body><div id="startDisc" role="dialog" aria-modal="true" style="display:none;position:fixed;inset:0;z-index:1000;background:rgba(123,63,228,.35);align-items:center;justify-content:center;padding:20px"><div style="background:#fff;border-radius:20px;padding:22px;max-width:420px;box-shadow:0 8px 30px rgba(123,63,228,.4);border-top:6px solid #ff5fa2;text-align:center;color:#3a2357"><div style="font-size:19px;font-weight:800;line-height:1.4;margin-bottom:18px">Narzędzie pomocnicze, niecertyfikowane. Każdą dawkę i decyzję weryfikuje lekarz.</div><button id="startDiscOk" style="width:100%;padding:15px;font-size:19px;font-weight:800;border:0;border-radius:14px;color:#fff;background:linear-gradient(120deg,#ff5fa2,#7b3fe4)">Rozumiem</button></div></div><script>(function(){var K='discAccepted_v1:'+document.title,d=document.getElementById('startDisc');var ok=false;try{ok=localStorage.getItem(K)==='1'}catch(e){}if(!ok&&window.parent===window)d.style.display='flex';document.getElementById('startDiscOk').onclick=function(){try{localStorage.setItem(K,'1')}catch(e){}d.style.display='none';};})();</script>
<header><h1>⚡ Stan padaczkowy SOR</h1><button id="info" class="ib">ℹ</button></header>
<div class="wrow"><label for="w">Masa ciała [kg]</label><input id="w" inputmode="decimal" placeholder="70"></div>
<div class="crow"><button class="tg" data-c="liver">wątroba</button><button class="tg" data-c="renal">nerki</button><button class="tg" data-c="cardiac">serce</button><button class="tg" data-c="preg">ciąża</button><span class="zr">ZRM BZD <button id="zm">−</button><b id="zn">0</b><button id="zp">+</button></span></div>
<div class="crow" id="crr" hidden><label>CLkr [ml/min]</label><input id="crcl" inputmode="decimal" class="sml"></div>
<div id="grid"></div>
<div id="res"></div>
<div id="infoBox" hidden></div>
<div class="disc">Narzędzie pomocnicze, niecertyfikowane. Każdą dawkę weryfikuje lekarz.</div>
<script src="engine.js"></script><script src="app.js"></script></body></html>
